apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      initContainers:
      - name: init-db
        image: postgres:15-alpine
        command: 
          - /bin/sh
          - -c
          - |
            until pg_isready -h 127.0.0.1 -U admin -d parserdb; do
              sleep 2
            done
            psql -h 127.0.0.1 -U admin -d parserdb -f /docker-entrypoint-initdb.d/init.sql
        env:
        - name: PGPASSWORD
          value: "test123"
        volumeMounts:
        - name: postgres-init-script
          mountPath: /docker-entrypoint-initdb.d/
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "test123"
        - name: POSTGRES_DB
          value: "parserdb"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        emptyDir: {}
      - name: postgres-init-script
        configMap:
          name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS parsed_data (
      id SERIAL PRIMARY KEY,
      content TEXT,
      created_at TIMESTAMP DEFAULT NOW(),
      telegram_id TEXT
    );
