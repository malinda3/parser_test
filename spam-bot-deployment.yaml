apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: spam-bot
  name: spam-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: spam-bot
