      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: spam-bot
    spec:
      containers:
        - image: spam-bot
          name: spam-bot
      restartPolicy: Always
