services:
  # ZooKeeper для Kafka
  zoo1:
    image: confluentinc/cp-zookeeper:7.3.2
    hostname: zoo1
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zoo1:2888:3888
    networks:
      - kafka_network

  # Kafka с ZooKeeper
  kafka:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    depends_on:
      - zoo1
    networks:
      - kafka_network

  # Бот
  bot:
    build:
      context: ./bot
    container_name: bot
    depends_on:
      - kafka
    networks:
      - kafka_network

  # Парсер
  parser:
    build:
      context: ./parser
    container_name: parser
    depends_on:
      - kafka
    networks:
      - kafka_network

  # PostgreSQL
  postgres:
    build:
      context: ./postgres
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=orders
    ports:
      - "5432:5432"
    networks:
      - kafka_network

  # Go Consumer
  go_consumer:
    build:
      context: ./db_go
    container_name: go_consumer
    depends_on:
      - kafka
    networks:
      - kafka_network

  # Spam Bot
  spam_bot:
    build:
      context: ./spam_bot
    container_name: spam_bot
    depends_on:
      - kafka
    networks:
      - kafka_network

volumes:
  kafka-data:

networks:
  kafka_network:
    driver: bridge
