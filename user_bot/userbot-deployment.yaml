apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-bot
  template:
    metadata:
      labels:
        app: telegram-bot
    spec:
      containers:
        - name: bot
          image: telegram-bot:latest
          imagePullPolicy: Never
          env:
            - name: API_URL
              value: "http://parser.kafka.svc.cluster.local:8000/parse"
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-api-test-key
                  key: API_KEY
            - name: REDIS_HOST
              value: "redis.kafka.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kafka
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None