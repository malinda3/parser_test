name: CI Test

on:
  push:
    branches: [ "v0.1" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push parser image
      run: |
        IMAGE_TAG=$(git rev-parse --short HEAD)
        make -f Makefile.ci build-parser IMAGE_TAG=$IMAGE_TAG
        make -f Makefile.ci push-parser IMAGE_TAG=$IMAGE_TAG

    - name: Build and Push bot image
      run: |
        IMAGE_TAG=$(git rev-parse --short HEAD)
        make -f Makefile.ci build-bot IMAGE_TAG=$IMAGE_TAG
        make -f Makefile.ci push-bot IMAGE_TAG=$IMAGE_TAG

    - name: Build and Push postgres image
      run: |
        IMAGE_TAG=$(git rev-parse --short HEAD)
        make -f Makefile.ci build-postgres IMAGE_TAG=$IMAGE_TAG
        make -f Makefile.ci push-postgres IMAGE_TAG=$IMAGE_TAG

    - name: Build and Push admin-bot image
      run: |
        IMAGE_TAG=$(git rev-parse --short HEAD)
        make -f Makefile.ci build-admin-bot IMAGE_TAG=$IMAGE_TAG
        make -f Makefile.ci push-admin-bot IMAGE_TAG=$IMAGE_TAG
